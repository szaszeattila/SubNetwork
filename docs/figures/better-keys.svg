<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1032" width="1000" height="1032" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif" fill="#20303b">
  <title>Better answer keys: what a good key needs, the proposed order, and why each step is better</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6d78"/>
    </marker>
    <symbol id="yes" viewBox="-10 -10 20 20"><circle r="8" fill="#2e7d4f"/></symbol>
    <symbol id="part" viewBox="-10 -10 20 20"><circle r="8" fill="#ffffff" stroke="#d98a1c" stroke-width="2"/><path d="M0,-8 A8,8 0 0 0 0,8 z" fill="#d98a1c"/></symbol>
    <symbol id="no" viewBox="-10 -10 20 20"><circle r="7.5" fill="#ffffff" stroke="#c0504d" stroke-width="2"/></symbol>
    <style>
      .h1 { font-size: 22px; font-weight: 700; fill: #1d4a63; }
      .sub { font-size: 12.5px; fill: #5b6d78; }
      .h2 { font-size: 17px; font-weight: 700; fill: #1d4a63; }
      .t { font-size: 13px; }
      .s { font-size: 11.5px; fill: #3d4f5a; }
      .b { font-weight: 700; }
      .n { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .card { fill: #f3f7f9; stroke: #a9bcc6; stroke-width: 1.2; }
      .key { fill: #e7f0f5; stroke: #245875; stroke-width: 1.6; }
      .line { stroke: #5b6d78; stroke-width: 1.4; fill: none; }
      .rule { stroke: #c9d6dc; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="1032" fill="#ffffff"/>

  <text x="30" y="40" class="h1">Better answer keys: the proposed order, and why each step is better</text>
  <text x="30" y="62" class="sub">docs/SIMILARITY-LITERATURE.md, Part 4. A proposal; nothing here is adopted. Each step reports beside today's grade, never in its place.</text>

  <!-- ============ A. What a good key needs ============ -->
  <line x1="30" y1="80" x2="970" y2="80" class="rule"/>
  <text x="30" y="104" class="h2">A   What a good key needs</text>

  <g>
    <rect x="30" y="118" width="148" height="92" rx="6" class="card"/>
    <circle cx="48" cy="136" r="11" fill="#1d4a63"/><text x="48" y="141" text-anchor="middle" class="n">1</text>
    <text x="64" y="134" class="t b">Asks the</text><text x="64" y="150" class="t b">page's question</text>
    <text x="40" y="172" class="s">effect and mechanism,</text><text x="40" y="187" class="s">not use or structure</text>

    <rect x="186" y="118" width="148" height="92" rx="6" class="card"/>
    <circle cx="204" cy="136" r="11" fill="#1d4a63"/><text x="204" y="141" text-anchor="middle" class="n">2</text>
    <text x="220" y="134" class="t b">Independent</text><text x="220" y="150" class="t b">of the score</text>
    <text x="196" y="172" class="s">shares none of its inputs,</text><text x="196" y="187" class="s">or says which it shares</text>

    <rect x="342" y="118" width="148" height="92" rx="6" class="card"/>
    <circle cx="360" cy="136" r="11" fill="#1d4a63"/><text x="360" y="141" text-anchor="middle" class="n">3</text>
    <text x="376" y="134" class="t b">Judges only</text><text x="376" y="150" class="t b">what it can</text>
    <text x="352" y="172" class="s">rank among molecules</text><text x="352" y="187" class="s">the key has an opinion of</text>

    <rect x="498" y="118" width="148" height="92" rx="6" class="card"/>
    <circle cx="516" cy="136" r="11" fill="#1d4a63"/><text x="516" y="141" text-anchor="middle" class="n">4</text>
    <text x="532" y="134" class="t b">Graded, with</text><text x="532" y="150" class="t b">negatives</text>
    <text x="508" y="172" class="s">near-misses partly right;</text><text x="508" y="187" class="s">opposites must rank low</text>

    <rect x="654" y="118" width="148" height="92" rx="6" class="card"/>
    <circle cx="672" cy="136" r="11" fill="#1d4a63"/><text x="672" y="141" text-anchor="middle" class="n">5</text>
    <text x="688" y="134" class="t b">Several judges,</text><text x="688" y="150" class="t b">one held out</text>
    <text x="664" y="172" class="s">adopt only what two of</text><text x="664" y="187" class="s">different provenance back</text>

    <rect x="810" y="118" width="160" height="92" rx="6" class="card"/>
    <circle cx="828" cy="136" r="11" fill="#1d4a63"/><text x="828" y="141" text-anchor="middle" class="n">6</text>
    <text x="844" y="134" class="t b">Fixed</text><text x="844" y="150" class="t b">before use</text>
    <text x="820" y="172" class="s">versioned; never changed</text><text x="820" y="187" class="s">with a constant it judges</text>
  </g>

  <!-- ============ B. The order ============ -->
  <line x1="30" y1="232" x2="970" y2="232" class="rule"/>
  <text x="30" y="256" class="h2">B   The proposed order, scored against those six</text>

  <!-- legend -->
  <use href="#yes" x="636" y="243" width="16" height="16"/><text x="656" y="256" class="s">meets it</text>
  <use href="#part" x="716" y="243" width="16" height="16"/><text x="736" y="256" class="s">partly</text>
  <use href="#no" x="786" y="243" width="16" height="16"/><text x="806" y="256" class="s">does not</text>

  <!-- column headers -->
  <text x="30" y="290" class="s b">key</text>
  <g>
    <circle cx="362" cy="285" r="10" fill="#1d4a63"/><text x="362" y="290" text-anchor="middle" class="n">1</text>
    <circle cx="410" cy="285" r="10" fill="#1d4a63"/><text x="410" y="290" text-anchor="middle" class="n">2</text>
    <circle cx="458" cy="285" r="10" fill="#1d4a63"/><text x="458" y="290" text-anchor="middle" class="n">3</text>
    <circle cx="506" cy="285" r="10" fill="#1d4a63"/><text x="506" y="290" text-anchor="middle" class="n">4</text>
    <circle cx="554" cy="285" r="10" fill="#1d4a63"/><text x="554" y="290" text-anchor="middle" class="n">5</text>
    <circle cx="602" cy="285" r="10" fill="#1d4a63"/><text x="602" y="290" text-anchor="middle" class="n">6</text>
  </g>
  <text x="636" y="290" class="s b">why it is better than the row above</text>
  <line x1="30" y1="300" x2="970" y2="300" class="rule"/>

  <!-- row 0 -->
  <rect x="30" y="306" width="300" height="80" rx="6" fill="#eef1f3" stroke="#9aa5ad" stroke-width="1.2"/>
  <text x="42" y="327" class="t b">Today · ATC N level 4</text>
  <text x="42" y="346" class="s">395 molecules, top-1 38.7%; MeSH graded beside</text>
  <text x="42" y="362" class="s">it but never required to agree</text>
  <use href="#part" x="354" y="338" width="16" height="16"/>
  <use href="#no" x="402" y="338" width="16" height="16"/>
  <use href="#no" x="450" y="338" width="16" height="16"/>
  <use href="#no" x="498" y="338" width="16" height="16"/>
  <use href="#part" x="546" y="338" width="16" height="16"/>
  <use href="#yes" x="594" y="338" width="16" height="16"/>
  <text x="636" y="324" class="s"><tspan class="b" fill="#20303b">The baseline.</tspan> Only 16 of its 64 classes are</text>
  <text x="636" y="340" class="s">mechanisms; 84 of its 174 misses are answers it</text>
  <text x="636" y="356" class="s">cannot judge; 39 of 110 hits read the same curation</text>
  <text x="636" y="372" class="s">as the score; nothing in it is an opposite.</text>
  <line x1="180" y1="386" x2="180" y2="394" class="line" marker-end="url(#arrow)"/>
  <!-- row 1 -->
  <rect x="30" y="396" width="300" height="80" rx="6" class="key"/>
  <text x="42" y="417" class="t b">Step 1 · Repair ATC and MeSH</text>
  <text x="42" y="436" class="s">no new data, harness changes only: filtered</text>
  <text x="42" y="452" class="s">ranking, classmates from every ATC level,</text>
  <text x="42" y="468" class="s">sibling credit (nDCG@10), an exclusion list</text>
  <use href="#part" x="354" y="428" width="16" height="16"/>
  <use href="#no" x="402" y="428" width="16" height="16"/>
  <use href="#yes" x="450" y="428" width="16" height="16"/>
  <use href="#part" x="498" y="428" width="16" height="16"/>
  <use href="#part" x="546" y="428" width="16" height="16"/>
  <use href="#yes" x="594" y="428" width="16" height="16"/>
  <text x="636" y="414" class="s"><tspan class="b" fill="#20303b">Stops grading ATC's filing as ranking errors.</tspan></text>
  <text x="636" y="430" class="s">Unjudgeable answers stop counting as misses;</text>
  <text x="636" y="446" class="s">a sibling class earns partial credit; the top ten</text>
  <text x="636" y="462" class="s">are read, not just the first hit. Same curators.</text>
  <line x1="180" y1="476" x2="180" y2="484" class="line" marker-end="url(#arrow)"/>
  <!-- row 2 -->
  <rect x="30" y="486" width="300" height="80" rx="6" class="key"/>
  <text x="42" y="507" class="t b">Step 2 · FDA pharmacologic class</text>
  <text x="42" y="526" class="s">a backfill, InChIKey → UNII → RxCUI, via NLM's</text>
  <text x="42" y="542" class="s">RxClass API; three axes: class (EPC), mechanism</text>
  <text x="42" y="558" class="s">(MoA) and physiologic effect (PE)</text>
  <use href="#yes" x="354" y="518" width="16" height="16"/>
  <use href="#part" x="402" y="518" width="16" height="16"/>
  <use href="#yes" x="450" y="518" width="16" height="16"/>
  <use href="#part" x="498" y="518" width="16" height="16"/>
  <use href="#yes" x="546" y="518" width="16" height="16"/>
  <use href="#yes" x="594" y="518" width="16" height="16"/>
  <text x="636" y="504" class="s"><tspan class="b" fill="#20303b">A different curator, classing by mechanism</tspan></text>
  <text x="636" y="520" class="s"><tspan class="b" fill="#20303b">and effect, never by structure.</tspan> FDA labels, not</text>
  <text x="636" y="536" class="s">WHO or ChEMBL. A third judge, so a change must</text>
  <text x="636" y="552" class="s">win twice. US-labelled drugs only.</text>
  <line x1="180" y1="566" x2="180" y2="574" class="line" marker-end="url(#arrow)"/>
  <!-- row 3 -->
  <rect x="30" y="576" width="300" height="80" rx="6" class="key"/>
  <text x="42" y="597" class="t b">Step 3 · CNS adverse-effect profiles</text>
  <text x="42" y="616" class="s">OnSIDES (CC BY 4.0, about 4,100 drugs): label</text>
  <text x="42" y="632" class="s">nervous-system and psychiatric effects, rare</text>
  <text x="42" y="648" class="s">effects weighted up, class boilerplate down</text>
  <use href="#part" x="354" y="608" width="16" height="16"/>
  <use href="#yes" x="402" y="608" width="16" height="16"/>
  <use href="#yes" x="450" y="608" width="16" height="16"/>
  <use href="#yes" x="498" y="608" width="16" height="16"/>
  <use href="#yes" x="546" y="608" width="16" height="16"/>
  <use href="#yes" x="594" y="608" width="16" height="16"/>
  <text x="636" y="594" class="s"><tspan class="b" fill="#20303b">The first judge sharing nothing with the score:</tspan></text>
  <text x="636" y="610" class="s">what drugs do to people, from label text, not</text>
  <text x="636" y="626" class="s">targets. A change that helps ATC and MeSH but</text>
  <text x="636" y="642" class="s">not this one has been tuned to curation.</text>
  <line x1="180" y1="656" x2="180" y2="664" class="line" marker-end="url(#arrow)"/>
  <!-- row 4 -->
  <rect x="30" y="666" width="300" height="80" rx="6" class="key"/>
  <text x="42" y="687" class="t b">Step 4 · Pre-registered pairwise key</text>
  <text x="42" y="706" class="s">the probe set grown to a few hundred pairs:</text>
  <text x="42" y="722" class="s">positives, known-unlike pairs and opposites,</text>
  <text x="42" y="738" class="s">each citing a source, frozen before first use</text>
  <use href="#yes" x="354" y="698" width="16" height="16"/>
  <use href="#part" x="402" y="698" width="16" height="16"/>
  <use href="#yes" x="450" y="698" width="16" height="16"/>
  <use href="#yes" x="498" y="698" width="16" height="16"/>
  <use href="#yes" x="546" y="698" width="16" height="16"/>
  <use href="#yes" x="594" y="698" width="16" height="16"/>
  <text x="636" y="684" class="s"><tspan class="b" fill="#20303b">The only key that can see an opposite ranked</tspan></text>
  <text x="636" y="700" class="s"><tspan class="b" fill="#20303b">high</tspan> (caffeine and adenosine), or an unlike pair</text>
  <text x="636" y="716" class="s">ranked close. Held out of every sweep, so no</text>
  <text x="636" y="732" class="s">constant can be tuned to it.</text>

  <!-- ============ C. Why this order ============ -->
  <line x1="30" y1="770" x2="970" y2="770" class="rule"/>
  <text x="30" y="794" class="h2">C   Why this order</text>

  <line x1="80" y1="990" x2="470" y2="990" class="line" marker-end="url(#arrow)"/>
  <line x1="80" y1="990" x2="80" y2="812" class="line" marker-end="url(#arrow)"/>
  <text x="275" y="1014" text-anchor="middle" class="s">effort to build →  (none · a backfill · hand curation)</text>
  <text x="62" y="902" text-anchor="middle" class="s" transform="rotate(-90 62 902)">independence from the score →</text>

  <path d="M110,976 L148,948 L250,904 L330,842 L430,868" fill="none" stroke="#9fbccd" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="110" cy="976" r="9" fill="#8d99a2"/><text x="102" y="961" text-anchor="middle" class="s">today</text>
  <circle cx="148" cy="948" r="11" fill="#245875"/><text x="148" y="953" text-anchor="middle" class="n">1</text>
  <text x="166" y="970" class="s">repair: free, same curators</text>
  <circle cx="250" cy="904" r="11" fill="#245875"/><text x="250" y="909" text-anchor="middle" class="n">2</text>
  <text x="267" y="924" class="s">EPC: a new curator</text>
  <circle cx="330" cy="842" r="11" fill="#245875"/><text x="330" y="847" text-anchor="middle" class="n">3</text>
  <text x="330" y="824" text-anchor="middle" class="s">adverse effects: shares nothing</text>
  <circle cx="430" cy="868" r="11" fill="#245875"/><text x="430" y="873" text-anchor="middle" class="n">4</text>
  <text x="430" y="896" text-anchor="middle" class="s">pairwise: as independent</text>
  <text x="430" y="910" text-anchor="middle" class="s">as its sources</text>

  <text x="510" y="822" class="t b">Cheapest first, most independent by step 3</text>
  <text x="510" y="842" class="s">Step 1 costs nothing and corrects the instrument every later</text>
  <text x="510" y="858" class="s">step is compared with. Steps 2 and 3 each add a judge further</text>
  <text x="510" y="874" class="s">from the score's inputs. Step 4 is hand work, so it waits until</text>
  <text x="510" y="890" class="s">the generated keys show where the hard cases are.</text>

  <rect x="510" y="906" width="460" height="98" rx="6" class="key"/>
  <text x="524" y="928" class="t b">Then the formula</text>
  <text x="524" y="947" class="s">Adopt a scoring change only if it improves the grade under</text>
  <text x="524" y="963" class="s">two judges of different provenance, with one held out. That</text>
  <text x="524" y="979" class="s">makes Part 2's objections testable: exposure-normalised affinity,</text>
  <text x="524" y="995" class="s">a null model for the cosine, prevalence conditioned on curation.</text>
</svg>
